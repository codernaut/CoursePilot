name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Full checks on Linux; Windows (where the owner develops) runs the tests only.
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        if: runner.os == 'Linux'
        run: uv run ruff check .

      - name: Ruff format
        if: runner.os == 'Linux'
        run: uv run ruff format --check .

      - name: Mypy
        if: runner.os == 'Linux'
        run: uv run mypy app tests ../scripts/build_release.py ../scripts/build_manual.py

      - name: Tests
        run: >
          uv run pytest
          --junitxml=reports/junit-${{ runner.os }}.xml
          --cov=app
          --cov-report=html:reports/htmlcov-${{ runner.os }}
          --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: backend/reports/
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Full checks on Linux; Windows (where the owner develops) runs the tests only.
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        if: runner.os == 'Linux'
        run: uv run ruff check .

      - name: Ruff format
        if: runner.os == 'Linux'
        run: uv run ruff format --check .

      - name: Mypy
        if: runner.os == 'Linux'
        run: uv run mypy app tests ../scripts/build_release.py ../scripts/build_manual.py

      - name: Tests
        run: >
          uv run pytest
          --junitxml=reports/junit-${{ runner.os }}.xml
          --cov=app
          --cov-report=html:reports/htmlcov-${{ runner.os }}
          --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: backend/reports/
          retention-days: 14

  docker:
    # The optional container image (CLAUDE.md section 1, "Deployment profiles"): it must build, pass
    # the environment check inside the image, and the compose stack must become ready. Nothing is
    # published; pushing to a registry is a separate owner decision (release.yml).
    name: docker image and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t coursepilot:ci --build-arg GIT_COMMIT=${{ github.sha }} .

      - name: Environment check inside the image (SQLite version, FTS5, sqlite-vec)
        run: docker run --rm coursepilot:ci python -m app.cli check

      - name: Compose smoke test
        run: |
          printf 'APP_ENV=development\nBASE_URL=http://localhost:8000\nSECRET_KEY=ci-only-not-a-secret\n' > .env
          sed -i 's#image: coursepilot:local#image: coursepilot:ci#' compose.yaml
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8000/api/v1/health/ready
          docker compose ps
          docker compose down -v

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Validate the compose file with the optional local-ai profile (no pull)
        run: |
          touch .env
          docker compose --profile local-ai config -q

      - name: Validate the Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes > /dev/null

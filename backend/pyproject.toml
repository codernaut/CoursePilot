[project]
name = "coursepilot-backend"
version = "0.1.0"
description = "CoursePilot API, ingestion worker, retrieval and agent"
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1,<0.23.0",
    "alembic>=1.20.1,<2.0.0",
    "fastapi>=0.162.0,<0.163.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "python-multipart>=0.0.33,<0.0.34",
    "sqlalchemy[asyncio]>=2.1.8,<3.0.0",
    "sqlite-vec>=0.1.9,<0.2.0",
    "structlog>=26.1.0,<27.0.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "ruff>=0.17.4,<0.18.0",
]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

{# Accent swatches (real buttons, handled by static/js/theme.js). #}
<div class="swatches" role="group" aria-label="Accent colour">
  <button type="button" data-accent="crimson" aria-label="Crimson accent" aria-pressed="true"></button>
  <button type="button" data-accent="coral" aria-label="Coral accent" aria-pressed="false"></button>
  <button type="button" data-accent="plum" aria-label="Plum accent" aria-pressed="false"></button>
  <button type="button" data-accent="teal" aria-label="Teal accent" aria-pressed="false"></button>
  <button type="button" data-accent="ocean" aria-label="Ocean accent" aria-pressed="false"></button>
</div>

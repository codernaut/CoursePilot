# ONE replica, ONE pod, TWO containers (web + worker) sharing one ReadWriteOnce volume.
#  * SQLite has a single writer and login throttling is in-process: never raise `replicas`.
#  * strategy Recreate: the old pod must release the volume before the new one starts (a rolling
#    update would run two writers at once).
#  * The worker is a sidecar, not a separate Deployment, because both need the same ReadWriteOnce
#    volume and therefore the same node.
# Configuration: `kubectl create secret generic coursepilot-env -n coursepilot --from-env-file=.env`
# (see README.md). The env entries below override the secret so paths and the bind address are
# always the container's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coursepilot
  namespace: coursepilot
  labels:
    app.kubernetes.io/name: coursepilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coursepilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursepilot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: web
          # Replace with the image you built and pushed (see README.md).
          image: registry.example.com/coursepilot:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "serve"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: coursepilot-env
          env:
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
            - name: DATA_DIR
              value: /data
            - name: DATABASE_URL
              value: sqlite+aiosqlite:////data/coursepilot.db
            - name: CHECKPOINT_DB_PATH
              value: /data/checkpoints.db
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: worker
          image: registry.example.com/coursepilot:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - secretRef:
                name: coursepilot-env
          env:
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
            - name: DATA_DIR
              value: /data
            - name: DATABASE_URL
              value: sqlite+aiosqlite:////data/coursepilot.db
            - name: CHECKPOINT_DB_PATH
              value: /data/checkpoints.db
          resources:
            # Parsing a very large PDF briefly peaks at 1-2 GB.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coursepilot-data
        - name: tmp
          emptyDir: {}
